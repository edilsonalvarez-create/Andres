name: QA Guardian CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Restaurar
        run: dotnet restore QAGuardian.sln
      - name: Compilar
        run: dotnet build QAGuardian.sln --no-restore -c Release
      - name: Pruebas unitarias e integración (con piso de cobertura)
        # /p:CollectCoverage activa el gate de regresión: falla si la cobertura
        # cae bajo el Threshold definido en cada proyecto de pruebas.
        run: dotnet test QAGuardian.sln --no-build -c Release --logger trx /p:CollectCoverage=true /p:CoverletOutputFormat=cobertura
      - name: Publicar resultados
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: "**/TestResults/**"

  frontend:
    name: Frontend (build + typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    name: Imágenes Docker
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build imagen API
        run: docker build -f src/QAGuardian.API/Dockerfile -t qaguardian-api:${{ github.sha }} .
      - name: Build imagen frontend
        run: docker build -t qaguardian-frontend:${{ github.sha }} ./frontend
