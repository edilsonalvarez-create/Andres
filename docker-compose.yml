name: qaguardian

services:
  # Sprint 16-B: SIN "ports" aquí — SQL Server y Redis solo son accesibles en la
  # red interna de compose (api/migrate/db-init/redis). Para depurar desde el
  # host en local, use docker-compose.override.yml (se carga automático con
  # `docker compose up`, pero NO con `docker compose -f docker-compose.yml up`,
  # que es el comando recomendado para producción/CI — ver Manual-Instalacion §4).
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?Defina SQL_SA_PASSWORD en .env}
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Sprint 16-A: migraciones EF fuera del proceso API (dotnet ef database update).
  migrate:
    image: mcr.microsoft.com/dotnet/sdk:9.0
    working_dir: /src
    volumes:
      - .:/src
    environment:
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=QAGuardian;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True"
      Database__UseSqlite: "false"
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - |
        set -euo pipefail
        dotnet tool restore
        dotnet ef database update \
          --project src/QAGuardian.Infrastructure/QAGuardian.Infrastructure.csproj \
          --startup-project src/QAGuardian.API/QAGuardian.API.csproj \
          --connection "$${ConnectionStrings__DefaultConnection}"

  # Sprint 16-B: crea el login/usuario de mínimo privilegio (database/00-app-user.sql).
  # Usa `sa` solo aquí (bootstrap puntual); el API nunca se conecta con `sa`.
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    working_dir: /scripts
    volumes:
      - ./database:/scripts:ro
    environment:
      SQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?Defina SQL_SA_PASSWORD en .env}
      APP_DB_USER: ${APP_DB_USER:-qaguardian_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Defina APP_DB_PASSWORD en .env (usuario de aplicación, mínimo privilegio)}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - |
        set -euo pipefail
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver,1433 -U sa -P "$$SQL_SA_PASSWORD" -C \
          -v AppLogin="$$APP_DB_USER" AppPassword="$$APP_DB_PASSWORD" \
          -i 00-app-user.sql

  api:
    build:
      context: .
      dockerfile: src/QAGuardian.API/Dockerfile
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    # Sprint 16-B: acceso a /var/run/docker.sock (residual, ver ADR-011) desde un
    # usuario non-root requiere pertenecer al GID del grupo "docker" del host.
    # Defina DOCKER_GID en .env (Linux: `getent group docker | cut -d: -f3`).
    group_add:
      - "${DOCKER_GID:-999}"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-QA}
      # Sprint 16-B: usuario de mínimo privilegio (sin DDL) — NO `sa`.
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=QAGuardian;User Id=${APP_DB_USER:-qaguardian_app};Password=${APP_DB_PASSWORD};TrustServerCertificate=True"
      ConnectionStrings__Redis: "redis:6379"
      # Hardening Sprint 16-A: el API solo siembra; el esquema lo aplica `migrate`.
      Database__ApplyMigrationsOnStartup: "false"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Defina JWT_SIGNING_KEY en .env}
      Security__EncryptionKey: ${ENCRYPTION_KEY:?Defina ENCRYPTION_KEY en .env}
      Anthropic__ApiKey: ${ANTHROPIC_API_KEY:-}
      Seed__AdminEmail: ${ADMIN_EMAIL:-admin@qaguardian.local}
      Seed__AdminPassword: ${ADMIN_PASSWORD:?Defina ADMIN_PASSWORD en .env (contraseña única, no el valor de ejemplo)}
      Cors__AllowedOrigins__0: "http://localhost:8081"
      # Sprint 13-B: sandbox Docker (Newman). Build: docker build -t qaguardian/runner-newman:local -f docker/runner-newman/Dockerfile docker/runner-newman
      Runners__UseSandbox: ${RUNNERS_USE_SANDBOX:-true}
      Runners__SandboxImage: ${RUNNERS_SANDBOX_IMAGE:-qaguardian/runner-newman:local}
      Runners__SandboxImagePlaywright: ${RUNNERS_SANDBOX_IMAGE_PLAYWRIGHT:-qaguardian/runner-playwright:local}
      Runners__SandboxImageJMeter: ${RUNNERS_SANDBOX_IMAGE_JMETER:-qaguardian/runner-jmeter:local}
      Runners__SandboxNetworkMode: ${RUNNERS_SANDBOX_NETWORK:-none}
    ports:
      - "5080:8080"
    volumes:
      - evidence:/app/storage/evidence
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8081:8080"

  # ── Perfil opcional: herramientas de análisis ──────────────────────
  sonarqube:
    image: sonarqube:community
    profiles: ["tools"]
    ports:
      - "9000:9000"
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonardata:/opt/sonarqube/data

  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    profiles: ["tools"]
    command: zap.sh -daemon -host 0.0.0.0 -port 8090 -config api.disablekey=true
    ports:
      - "8090:8090"

volumes:
  sqldata:
  sonardata:
  evidence:
